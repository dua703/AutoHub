<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fireGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Car Body -->
  <rect x="30" y="100" width="140" height="50" rx="8" fill="url(#carGradient)"/>
  <rect x="40" y="110" width="120" height="30" rx="6" fill="#ffffff" opacity="0.15"/>
  
  <!-- Car Windows -->
  <rect x="50" y="115" width="50" height="20" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="110" y="115" width="50" height="20" rx="4" fill="#ffffff" opacity="0.25"/>
  
  <!-- Car Wheels -->
  <circle cx="60" cy="150" r="15" fill="#1f2937"/>
  <circle cx="60" cy="150" r="10" fill="#4b5563"/>
  <circle cx="60" cy="150" r="6" fill="#6b7280"/>
  
  <circle cx="140" cy="150" r="15" fill="#1f2937"/>
  <circle cx="140" cy="150" r="10" fill="#4b5563"/>
  <circle cx="140" cy="150" r="6" fill="#6b7280"/>
  
  <!-- Car Headlights -->
  <ellipse cx="170" cy="125" rx="8" ry="6" fill="#fbbf24"/>
  <ellipse cx="30" cy="125" rx="8" ry="6" fill="#fbbf24"/>
  
  <!-- Flaming Effect - Main Flame -->
  <path d="M 100 30 L 80 80 L 90 80 L 100 50 L 110 80 L 120 80 Z" fill="url(#fireGradient)"/>
  <path d="M 100 40 L 85 85 L 92 85 L 100 60 L 108 85 L 115 85 Z" fill="#fbbf24" opacity="0.8"/>
  <path d="M 100 50 L 88 88 L 94 88 L 100 70 L 106 88 L 112 88 Z" fill="#f59e0b" opacity="0.6"/>
  
  <!-- Additional Flames -->
  <path d="M 85 25 L 70 75 L 82 75 L 85 55 L 88 75 L 98 75 Z" fill="url(#fireGradient)" opacity="0.7"/>
  <path d="M 115 25 L 100 75 L 112 75 L 115 55 L 118 75 L 128 75 Z" fill="url(#fireGradient)" opacity="0.7"/>
  
  <!-- Speed Lines -->
  <line x1="20" y1="120" x2="30" y2="120" stroke="#cbd5e1" stroke-width="2" opacity="0.5"/>
  <line x1="20" y1="130" x2="30" y2="130" stroke="#cbd5e1" stroke-width="2" opacity="0.5"/>
  <line x1="170" y1="120" x2="180" y2="120" stroke="#cbd5e1" stroke-width="2" opacity="0.5"/>
  <line x1="170" y1="130" x2="180" y2="130" stroke="#cbd5e1" stroke-width="2" opacity="0.5"/>
</svg>


